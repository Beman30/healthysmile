<style>
:root{
  --black:#0e0e0e;--ink:#141416;--panel:#1a1a1c;--line:#2a2a2c;
  --white:#fafaf8;--gray-300:#d4d2cc;--gray-500:#8a8880;
  --accent:#C8005C;--accent-soft:#f0a0c0;--ok:#4ea87a;
  --serif:'DM Serif Display',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--black);color:var(--white);font-family:var(--sans);font-weight:300;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
h1{font-family:var(--serif);font-weight:400;line-height:1.15;letter-spacing:-.015em}
header{border-bottom:1px solid var(--line);padding:14px 20px}
header .logo img{height:34px;display:block}
main{padding:44px 0 60px;text-align:center}
.tick{width:60px;height:60px;border-radius:50%;border:2px solid var(--ok);display:flex;align-items:center;
      justify-content:center;margin:0 auto 22px;color:var(--ok);font-size:1.7rem}
h1{font-size:clamp(1.7rem,5.4vw,2.3rem);margin-bottom:10px}
.sub{color:var(--gray-300);margin-bottom:30px}
.box{border:1px solid var(--line);border-radius:14px;background:var(--ink);padding:24px;text-align:left;margin-bottom:16px}
.svc{font-family:var(--serif);font-size:1.25rem;line-height:1.25;margin-bottom:16px}
.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;font-size:.96rem;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.k{color:var(--gray-500)}
.v{color:var(--white);text-align:right}
.v.paid{color:var(--ok)}
.v.due{color:var(--accent-soft)}
.place{border:1px solid var(--line);border-radius:14px;background:var(--ink);padding:20px;text-align:left;margin-bottom:16px}
.place b{display:block;font-weight:500}
.place span{font-size:.94rem;color:var(--gray-300)}
.place a{display:inline-block;margin-top:8px;font-size:.88rem;color:var(--accent-soft)}
.acts{display:grid;gap:10px;margin-top:22px}
.btn{display:block;padding:15px;border-radius:9px;text-decoration:none;font-size:1rem;font-weight:500;text-align:center}
.btn-a{background:var(--accent);color:#fff}
.btn-b{border:1px solid var(--line);color:var(--white)}
.msg{padding:14px 16px;border-radius:9px;font-size:.93rem;background:rgba(255,107,107,.1);
     border:1px solid rgba(255,107,107,.35);color:#ffb3b3;text-align:left}
.pending{background:rgba(240,160,192,.08);border-color:rgba(240,160,192,.3);color:var(--accent-soft)}
.skel{color:var(--gray-500)}
</style>

<main>
<div class="wrap">
  <div id="content">
    <p class="skel">Verifichiamo il pagamento…</p>
  </div>
</div>
</main>

<script>
var API = 'https://healthysmile-checkout.nicolapalmia.workers.dev';
var WA  = 'https://wa.me/393924076794';
var MAPS = 'https://maps.app.goo.gl/xG5N6YaYgg8Mxegp9';

(function(){
  var id = new URLSearchParams(location.search).get('booking');
  var c  = document.getElementById('content');
  function ev(n,p){ if(typeof gtag==='function') gtag('event',n,p||{}); }
  function eur(n){ return Number(n).toLocaleString('it-IT',{minimumFractionDigits:0,maximumFractionDigits:2})+' €'; }
  function esc(s){ return String(s).replace(/[<>&"]/g,function(x){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[x];}); }

  if(!id){ c.innerHTML = '<div class="msg">Manca il riferimento della prenotazione.</div>'; return; }

  // il pagamento lo conferma il webhook, che puo' arrivare un attimo dopo
  // il rientro dell'utente: si riprova qualche volta prima di arrendersi
  var tries = 0;
  (function poll(){
    fetch(API + '/api/bookings/' + encodeURIComponent(id))
      .then(function(r){ if(!r.ok) throw new Error('Prenotazione non trovata'); return r.json(); })
      .then(function(b){
        if(b.payment_status !== 'paid' && tries < 5){ tries++; return setTimeout(poll, 2000); }
        render(b);
      })
      .catch(function(e){ c.innerHTML = '<div class="msg">'+esc(e.message)+'. Scrivici su WhatsApp: <a href="'+WA+'" style="color:#f0a0c0">'+WA.replace('https://','')+'</a></div>'; });
  })();

  function fmtDate(iso){
    if(!iso) return '—';
    var p = iso.split('-'); if(p.length!==3) return iso;
    return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }

  function ics(b){
    if(!b.appointment_date || !b.appointment_time) return null;
    var d = b.appointment_date.replace(/-/g,'');
    var t = b.appointment_time.replace(':','') + '00';
    var endH = String(Math.min(23, parseInt(b.appointment_time.slice(0,2),10)+1)).padStart(2,'0');
    var end = d + 'T' + endH + b.appointment_time.slice(3,5) + '00';
    var body = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Healthy Smile//IT','BEGIN:VEVENT',
      'UID:'+b.booking_id+'@healthysmile.it',
      'DTSTART:'+d+'T'+t, 'DTEND:'+end,
      'SUMMARY:'+b.service_name,
      'LOCATION:Healthy Smile\\, Via Madama Cristina 2\\, Torino',
      'DESCRIPTION:Prenotazione Healthy Smile. Saldo da pagare in studio: '+(b.balance_due||0)+' EUR',
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');
    return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(body);
  }

  function render(b){
    var paid = b.payment_status === 'paid';
    var appt = b.appointment_date && b.appointment_time;
    var cal = ics(b);
    var waMsg = encodeURIComponent(
      'Ciao, ho appena prenotato ' + b.service_name +
      (appt ? ' per ' + fmtDate(b.appointment_date) + ' alle ' + b.appointment_time : '') + '.'
    );

    c.innerHTML =
      '<div class="tick">✓</div>' +
      '<h1>' + (paid ? 'Appuntamento confermato' : 'Pagamento in verifica') + '</h1>' +
      '<p class="sub">' + (paid
        ? 'Ti abbiamo mandato una mail di riepilogo.'
        : 'Il pagamento risulta ancora in elaborazione. Se entro qualche minuto non ricevi conferma, scrivici.') + '</p>' +

      (paid ? '' : '<div class="msg pending">Stato attuale: ' + esc(b.payment_status) + '</div>') +

      '<div class="box">' +
        '<div class="svc">' + esc(b.service_name) + '</div>' +
        (appt
          ? '<div class="row"><span class="k">Data</span><span class="v">' + fmtDate(b.appointment_date) + '</span></div>' +
            '<div class="row"><span class="k">Ora</span><span class="v">' + esc(b.appointment_time) + '</span></div>'
          : '') +
        '<div class="row"><span class="k">Pagato online</span><span class="v paid">' + eur(b.amount_paid) + '</span></div>' +
        (b.balance_due > 0
          ? '<div class="row"><span class="k">Da pagare in studio</span><span class="v due">' + eur(b.balance_due) + '</span></div>'
          : '') +
        '<div class="row"><span class="k">Riferimento</span><span class="v" style="font-size:.8rem">' + esc(b.booking_id.slice(0,8)) + '</span></div>' +
      '</div>' +

      '<div class="place">' +
        '<b>Healthy Smile</b><span>Via Madama Cristina 2 · Torino</span><br>' +
        '<a href="' + MAPS + '" target="_blank" rel="noopener">Apri su Maps →</a>' +
      '</div>' +

      '<div class="acts">' +
        (cal ? '<a class="btn btn-a" href="' + cal + '" download="healthy-smile.ics">Aggiungi al calendario</a>' : '') +
        '<a class="btn btn-b" href="' + WA + '?text=' + waMsg + '" target="_blank" rel="noopener">Scrivici su WhatsApp</a>' +
      '</div>';

    if(paid){
      ev('hs_booking_confirmed',{service:b.service_id, value:b.amount_paid, currency:'EUR'});
      if(typeof gtag==='function') gtag('event','conversion',{send_to:'AW-947982327', value:b.amount_paid, currency:'EUR'});
    }
  }
})();
</script>

<script src="/components.js"></script>
</body>
</html>
