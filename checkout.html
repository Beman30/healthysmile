<style>
:root{
  --black:#0e0e0e;--ink:#141416;--panel:#1a1a1c;--line:#2a2a2c;
  --white:#fafaf8;--gray-300:#d4d2cc;--gray-500:#8a8880;
  --accent:#C8005C;--accent-soft:#f0a0c0;--err:#ff6b6b;
  --serif:'DM Serif Display',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--black);color:var(--white);font-family:var(--sans);font-weight:300;
     line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
h1,h2{font-family:var(--serif);font-weight:400;line-height:1.15;letter-spacing:-.015em}

header{border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
header .logo img{height:34px;display:block}
header a.back{font-size:.86rem;color:var(--gray-500);text-decoration:none}
header a.back:hover{color:var(--white)}

main{padding:34px 0 60px}
.eyebrow{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-soft);font-weight:500;margin-bottom:14px}
h1{font-size:clamp(1.6rem,5vw,2.1rem);margin-bottom:26px}

.box{border:1px solid var(--line);border-radius:14px;background:var(--ink);padding:22px;margin-bottom:16px}
.svc{font-family:var(--serif);font-size:1.25rem;line-height:1.25;margin-bottom:14px}
.meta{display:grid;gap:9px;font-size:.95rem}
.meta .row{display:flex;justify-content:space-between;gap:14px}
.meta .k{color:var(--gray-500)}
.meta .v{color:var(--white);text-align:right}
.place{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:.92rem;color:var(--gray-300)}
.place b{display:block;color:var(--white);font-weight:500}

/* prezzo */
.pay{border-color:var(--accent);background:linear-gradient(160deg,rgba(200,0,92,.13),var(--ink) 68%)}
.tot{display:flex;justify-content:space-between;font-size:.95rem;color:var(--gray-300);margin-bottom:14px}
.tot b{color:var(--white);font-weight:500}
.today-lab{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-soft);font-weight:500}
.today{font-family:var(--serif);font-size:clamp(2.1rem,8vw,2.9rem);line-height:1.1;margin:4px 0 10px}
.after{font-size:.93rem;color:var(--gray-300)}
.custom-amt{margin-top:12px}
.custom-amt input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);color:var(--white);font-family:var(--sans);font-size:1.05rem}

/* form */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.8rem;color:var(--gray-500);margin-bottom:6px}
input[type=text],input[type=tel],input[type=email]{
  width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);color:var(--white);font-family:var(--sans);font-size:1rem}
input:focus{outline:none;border-color:var(--accent)}
input.bad{border-color:var(--err)}
.field{margin-bottom:14px}
.terms{display:flex;gap:11px;align-items:flex-start;margin-top:4px}
.terms input{margin-top:4px;width:19px;height:19px;accent-color:var(--accent);flex-shrink:0}
.terms label{font-size:.9rem;color:var(--gray-300);margin:0;cursor:pointer}
.terms-text{font-size:.84rem;color:var(--gray-500);margin-top:11px;padding-left:30px;line-height:1.55}

.btn{display:block;width:100%;background:var(--accent);color:#fff;border:none;border-radius:9px;
  padding:16px;font-family:var(--sans);font-size:1.02rem;font-weight:500;cursor:pointer;
  transition:opacity .2s;margin-top:6px}
.btn:hover{opacity:.9}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-pp{background:#ffc439;color:#111;margin-top:10px}
.sep{text-align:center;font-size:.8rem;color:var(--gray-500);margin:16px 0 6px}
.msg{margin-top:14px;padding:13px 15px;border-radius:9px;font-size:.92rem;display:none}
.msg.err{display:block;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.35);color:#ffb3b3}
.secure{margin-top:18px;text-align:center;font-size:.8rem;color:var(--gray-500)}
.skel{color:var(--gray-500)}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
</style>
</head>

<main>
<div class="wrap">

  <div class="eyebrow">Conferma</div>
  <h1 id="title">Il tuo appuntamento</h1>

  <div class="box" id="summary">
    <div class="svc skel" id="svcName">Caricamento…</div>
    <div class="meta" id="svcMeta"></div>
    <div class="place">
      <b>Healthy Smile</b>
      Via Madama Cristina 2 · Torino
    </div>
  </div>

  <div class="box pay" id="payBox" hidden>
    <div class="tot"><span>Prezzo totale</span><b id="totPrice">—</b></div>
    <div class="today-lab" id="todayLab">Oggi paghi</div>
    <div class="today" id="todayAmt">—</div>
    <div class="after" id="afterTxt"></div>
    <div class="custom-amt" id="customWrap" hidden>
      <label for="customAmt">Importo da versare oggi</label>
      <input type="text" id="customAmt" inputmode="decimal" placeholder="0,00">
    </div>
  </div>

  <form class="box" id="form" novalidate>
    <div class="grid2">
      <div class="field"><label for="fn">Nome</label><input type="text" id="fn" autocomplete="given-name" required></div>
      <div class="field"><label for="ln">Cognome</label><input type="text" id="ln" autocomplete="family-name" required></div>
    </div>
    <div class="field"><label for="ph">Telefono</label><input type="tel" id="ph" autocomplete="tel" required></div>
    <div class="field"><label for="em">Email</label><input type="email" id="em" autocomplete="email" required></div>

    <div id="termsWrap" hidden>
      <div class="terms">
        <input type="checkbox" id="terms">
        <label for="terms">Ho letto e accetto le condizioni di prenotazione.</label>
      </div>
      <p class="terms-text" id="termsText"></p>
    </div>

    <button type="button" class="btn" id="payStripe" disabled>Paga con carta</button>
    <div class="sep">oppure</div>
    <button type="button" class="btn btn-pp" id="payPaypal" disabled>Paga con PayPal</button>

    <div class="msg" id="msg"></div>
    <p class="secure">Pagamento gestito da Stripe e PayPal. Healthy Smile non vede né conserva i dati della tua carta.</p>
  </form>

</div>
</main>

<script>
/* ═══════════════════════════════════════════════════════════
   Checkout universale. Non conosce nessun prezzo: chiede tutto
   al backend a partire dal service_id che arriva nell'URL.
   ═══════════════════════════════════════════════════════════ */
var API = 'https://healthysmile-checkout.healthysmile.workers.dev';

(function(){
  var q = new URLSearchParams(location.search);
  var serviceId = q.get('service');
  var date = q.get('date');
  var time = q.get('time');
  var svc = null;

  var $ = function(id){ return document.getElementById(id); };
  function ev(n,p){ if(typeof gtag==='function') gtag('event',n,p||{}); }
  function eur(n){ return Number(n).toLocaleString('it-IT',{minimumFractionDigits:0,maximumFractionDigits:2}) + ' €'; }
  function showErr(t){ var m=$('msg'); m.textContent=t; m.className='msg err'; }
  function clearErr(){ $('msg').className='msg'; }

  $('back').href = document.referrer && document.referrer.indexOf(location.host)>-1 ? document.referrer : '/';

  if(!serviceId){ showErr('Manca il servizio da prenotare. Torna alla pagina da cui sei arrivato.'); return; }

  // 1. il backend dice cosa si sta comprando e quanto costa
  fetch(API + '/api/services/' + encodeURIComponent(serviceId))
    .then(function(r){ if(!r.ok) throw new Error('Servizio non riconosciuto'); return r.json(); })
    .then(render)
    .catch(function(e){
      $('svcName').textContent = 'Servizio non disponibile';
      showErr(e.message + '. Scrivici su WhatsApp e lo sistemiamo subito.');
    });

  function render(s){
    svc = s;
    $('svcName').textContent = s.name;
    $('svcName').classList.remove('skel');

    var meta = $('svcMeta'); meta.innerHTML = '';
    if(s.requires_appointment){
      if(!date || !time){
        showErr('Manca la data o l\'ora dell\'appuntamento.');
      } else {
        meta.innerHTML =
          '<div class="row"><span class="k">Data</span><span class="v">'+fmtDate(date)+'</span></div>' +
          '<div class="row"><span class="k">Ora</span><span class="v">'+time+'</span></div>';
      }
    } else {
      $('title').textContent = 'Il tuo pagamento';
    }

    $('payBox').hidden = false;
    $('totPrice').textContent = eur(s.total_price);

    if(s.payment_mode === 'custom'){
      $('todayLab').textContent = 'Quanto vuoi versare oggi';
      $('todayAmt').textContent = '—';
      $('customWrap').hidden = false;
      $('afterTxt').textContent = 'Minimo ' + eur(s.minimum_amount||0) + ' · massimo ' + eur(s.maximum_amount||s.total_price) + '.';
      $('customAmt').addEventListener('input', function(){
        var v = parseFloat(this.value.replace(',','.'));
        $('todayAmt').textContent = isFinite(v) ? eur(v) : '—';
        validate();
      });
    } else {
      $('todayAmt').textContent = eur(s.amount_due_now);
      $('afterTxt').textContent = s.balance_due_later > 0
        ? 'I ' + eur(s.balance_due_later) + ' rimanenti verranno pagati in studio.'
        : 'Nessun saldo da pagare in studio.';
    }

    if(s.requires_appointment && s.terms){
      $('termsWrap').hidden = false;
      $('termsText').textContent = s.terms;
    }

    ['fn','ln','ph','em'].forEach(function(id){ $(id).addEventListener('input', validate); });
    if(!$('termsWrap').hidden) $('terms').addEventListener('change', validate);
    validate();
    ev('hs_checkout_view',{service:serviceId});
  }

  function fmtDate(iso){
    var p = iso.split('-'); if(p.length!==3) return iso;
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    return d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  }

  function valid(){
    if(!svc) return false;
    var okName = $('fn').value.trim().length>1 && $('ln').value.trim().length>1;
    var okPh = /^[+0-9 ().-]{6,25}$/.test($('ph').value.trim());
    var okEm = /^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test($('em').value.trim());
    var okTerms = $('termsWrap').hidden || $('terms').checked;
    var okAppt = !svc.requires_appointment || (date && time);
    var okAmt = true;
    if(svc.payment_mode==='custom'){
      var v = parseFloat($('customAmt').value.replace(',','.'));
      okAmt = isFinite(v) && v >= (svc.minimum_amount||0) && v <= (svc.maximum_amount||svc.total_price);
    }
    return okName && okPh && okEm && okTerms && okAppt && okAmt;
  }

  function validate(){
    var v = valid();
    $('payStripe').disabled = !v;
    $('payPaypal').disabled = !v;
  }

  function payload(){
    var b = {
      service_id: serviceId,
      first_name: $('fn').value.trim(),
      last_name:  $('ln').value.trim(),
      phone:      $('ph').value.trim(),
      email:      $('em').value.trim(),
      terms_accepted: $('termsWrap').hidden ? true : $('terms').checked
    };
    if(svc.requires_appointment){ b.date = date; b.time = time; }
    if(svc.payment_mode==='custom') b.requested_amount = parseFloat($('customAmt').value.replace(',','.'));
    return b;
  }

  function go(provider, btn){
    if(!valid()) return;
    clearErr();
    var old = btn.textContent;
    btn.disabled = true; btn.textContent = 'Un attimo…';
    ev('hs_checkout_start',{service:serviceId, provider:provider});

    fetch(API + '/api/checkout/' + provider, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload())
    })
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
    .then(function(res){
      if(!res.ok || !res.d.redirect_url) throw new Error(res.d.error || 'Non riusciamo ad avviare il pagamento.');
      location.href = res.d.redirect_url;
    })
    .catch(function(e){
      showErr(e.message);
      btn.disabled = false; btn.textContent = old;
      validate();
    });
  }

  $('payStripe').addEventListener('click', function(){ go('stripe', this); });
  $('payPaypal').addEventListener('click', function(){ go('paypal', this); });

  if(q.get('annullato')) showErr('Pagamento annullato. Puoi riprovare quando vuoi: l\'orario resta tuo ancora per qualche minuto.');
})();
</script>

<script src="/components.js"></script>
</body>
