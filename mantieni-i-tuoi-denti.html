<!-- Meta Pixel — Eventi Custom Healthy Smile -->
<script>
(function () {

  // ── Utility: esegui dopo che il DOM è pronto ──
  function onReady(fn) {
    if (document.readyState !== 'loading') fn();
    else document.addEventListener('DOMContentLoaded', fn);
  }

  onReady(function () {

    // ════════════════════════════════════════════════
    // 2. VerificaProfilo — EVENTO CHIAVE
    //    Si spara quando l'utente ha effettivamente LETTO
    //    la sezione "Non tutti possono entrare nel Piano
    //    Protezione" (almeno il 60% visibile nel viewport,
    //    per almeno 1 secondo continuativo).
    // ════════════════════════════════════════════════
    var _verificaFired = false;
    var targetSection = document.getElementById('section-verify-profile');

    if (targetSection && !_verificaFired) {
      var _timer = null;

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
            // Sezione visibile → avvia timer 1s
            if (!_timer) {
              _timer = setTimeout(function () {
                if (!_verificaFired) {
                  _verificaFired = true;
                  observer.disconnect();
                  fbq('trackCustom', 'VerificaProfilo', {
                    content_name: 'Piano Protezione — Sezione Verifica',
                    content_category: 'Lead Intent',
                    source: 'scroll_read',
                    landing: 'mantieni_denti'
                  });
                }
              }, 1000);
            }
          } else {
            // Uscita dalla viewport prima del secondo → annulla timer
            if (_timer) { clearTimeout(_timer); _timer = null; }
          }
        });
      }, { threshold: 0.6 });

      observer.observe(targetSection);
    }


    // ════════════════════════════════════════════════
    // 3. ContattoWhatsApp — click su qualsiasi link WA
    //    Usa evento standard Lead (ottimizzazione nativa Meta)
    //    + custom per granularità
    // ════════════════════════════════════════════════
    document.querySelectorAll('a[href*="wa.me"]').forEach(function (el) {
      el.addEventListener('click', function () {
        var source = 'generico';
        if (el.classList.contains('nav-cta'))    source = 'nav';
        if (el.classList.contains('drawer-wa'))  source = 'menu_mobile';
        if (el.classList.contains('sticky-wa'))  source = 'sticky_bar';
        if (el.classList.contains('ai-wa-link')) source = 'risposta_ai';
        if (el.classList.contains('ai-main-wa')) source = 'ai_principale';
        if (el.id === 'btn-start-hs-path')       source = 'cta_prenota';

        fbq('track', 'Lead', {
          content_name: 'Contatto WhatsApp',
          content_category: 'Piano Protezione',
          source_detail: source
        });

        fbq('trackCustom', 'ContattoWhatsApp', {
          source: source,
          landing: 'mantieni_denti'
        });
      });
    });


    // ════════════════════════════════════════════════
    // 4. PrenotaPercorso — CTA "Prenota la valutazione"
    // ════════════════════════════════════════════════
    var btnStart = document.getElementById('btn-start-hs-path');
    if (btnStart) {
      btnStart.addEventListener('click', function () {
        fbq('trackCustom', 'PrenotaPercorso', {
          content_name: 'Valutazione Iniziale Healthy Smile',
          content_category: 'Piano Protezione',
          value: 50,
          currency: 'EUR'
        });
      });
    }

  }); // fine onReady

})();
</script>
<!-- Fine Meta Pixel — Eventi Custom -->
