<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0e0e0e;
  --white:#fafaf8;
  --gray-100:#f2f1ee;
  --gray-300:#d4d2cc;
  --gray-500:#888680;
  --gray-700:#4a4845;
  --accent:#C8005C;
  --green:#25D366;
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --risk-green:#2dff7a;
  --risk-yellow:#ffd166;
  --risk-red:#ff4d6d;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--black);color:var(--white);line-height:1.6;font-size:16px;overflow-x:hidden}
@media(max-width:768px){body{padding-bottom:56px}}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;font-family:var(--sans)}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:var(--black);border-bottom:1px solid #1e1e1e}
.nav-inner{max-width:680px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:16px;height:56px}
.nav-logo{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--white);flex-shrink:0;margin-right:auto}
.nav-logo .sm{color:var(--accent)}
.nav-links{display:flex;align-items:center;gap:20px;font-size:13px}
.nav-links a{color:#bbb;transition:color .2s}
.nav-links a:hover{color:var(--white)}
.nav-sep{width:1px;height:16px;background:#333}
.nav-phone{font-size:13px;color:#aaa;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:color .2s}
.nav-phone:hover{color:var(--white)}
.nav-phone svg{width:13px;height:13px;flex-shrink:0}
.nav-cta{background:var(--accent);color:var(--white);font-size:13px;font-weight:500;padding:7px 14px;border-radius:6px;white-space:nowrap;transition:opacity .2s;flex-shrink:0}
.nav-cta:hover{opacity:.88}
.hamburger{display:none;width:36px;height:36px;align-items:center;justify-content:center;flex-direction:column;gap:5px;flex-shrink:0}
.hamburger span{display:block;width:22px;height:2px;background:var(--white);border-radius:2px;transition:transform .25s,opacity .25s}
@media(max-width:767px){
  .nav-links,.nav-sep,.nav-phone{display:none}
  .hamburger{display:flex}
  .nav-cta{display:none}
}

/* DRAWER */
.drawer-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;z-index:201;width:260px;height:100%;background:#111;padding:24px 20px;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-close{align-self:flex-end;font-size:22px;color:#aaa;cursor:pointer;background:none;border:none;font-family:var(--sans);margin-bottom:24px;line-height:1}
.drawer-logo{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--white);margin-bottom:24px}
.drawer-logo .sm{color:var(--accent)}
.drawer a{display:block;font-size:15px;color:#bbb;padding:11px 0;border-bottom:1px solid #1e1e1e}
.drawer a:hover{color:var(--white)}
.drawer-phone{display:flex;align-items:center;gap:8px;font-size:15px;color:#aaa;padding:14px 0;border-bottom:1px solid #1e1e1e}
.drawer-phone svg{width:15px;height:15px;flex-shrink:0}
.drawer-wa{display:flex!important;align-items:center;justify-content:center;gap:8px;background:var(--accent)!important;color:var(--white)!important;padding:14px!important;border-radius:8px;margin-top:20px;font-size:15px;font-weight:500;text-align:center;border-bottom:none!important}
.drawer-wa svg{width:16px;height:16px}

/* HERO */
.hero{background:var(--black);padding:72px 0 60px}
.hero-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;margin-bottom:20px}
.hero h1{font-family:var(--serif);font-size:clamp(32px,5.5vw,48px);line-height:1.15;color:var(--white);margin-bottom:20px}
.hero h1 .aw{color:var(--accent);font-style:italic}
.hero-sub{font-family:var(--serif);font-style:italic;font-size:clamp(17px,2.5vw,20px);color:#c8c6c0;line-height:1.5;margin-bottom:14px}
.hero-micro{font-size:14px;color:#c0beb8;margin-bottom:48px;max-width:560px}
@keyframes stepin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.case-accent{width:28px;height:2px;background:var(--accent);margin-bottom:20px}
.case-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-500);margin-bottom:12px}
.case-title{font-family:var(--serif);font-size:clamp(26px,4.5vw,36px);line-height:1.2;color:var(--black);margin-bottom:28px}
.case-title em{color:var(--accent);font-style:italic}
.body-step{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.case-p{font-size:15px;color:#2a2826;line-height:1.7;margin-bottom:24px}

/* DUAL CTA */
.dual-cta{display:flex;gap:10px;margin-bottom:10px}
.dual-cta>a{flex:1}
.btn-tel-main{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--white);font-size:14px;font-weight:500;padding:13px 16px;border-radius:8px;transition:opacity .2s;text-align:center;line-height:1.3}
.btn-tel-main:hover{opacity:.88}
.btn-tel-main svg,.btn-wa-alt svg{width:16px;height:16px;flex-shrink:0}
.btn-wa-alt{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;font-size:14px;font-weight:500;padding:13px 16px;border-radius:8px;transition:opacity .2s;text-align:center;line-height:1.3}
.btn-wa-alt:hover{opacity:.88}
@media(max-width:420px){.dual-cta{flex-direction:column}}

.ghost-btn{display:inline-block;font-size:13px;color:var(--gray-500);border-bottom:1px solid var(--gray-300);padding-bottom:2px;transition:color .2s,border-color .2s;margin-bottom:28px}
.ghost-btn:hover{color:var(--black);border-color:var(--black)}

/* INLINE AI EXPANDER */
.ai-expander{border-top:1px solid var(--gray-300);margin-top:20px;padding-top:18px}
.ai-trigger-btn{background:none;border:none;font-family:var(--sans);font-size:13px;color:var(--gray-500);display:flex;align-items:center;gap:6px;cursor:pointer;transition:color .2s;padding:0}
.ai-trigger-btn:hover{color:var(--black)}
.ai-trigger-btn::after{content:'→';transition:transform .2s}
.ai-expand-body{display:none;margin-top:16px}
.ai-expand-body.open{display:block;animation:stepin .3s ease both}
.ai-textarea{width:100%;min-height:80px;padding:12px;border:1px solid var(--gray-300);border-radius:8px;font-family:var(--sans);font-size:14px;color:var(--black);background:var(--white);resize:vertical;margin-bottom:10px}
.ai-textarea:focus{outline:none;border-color:var(--accent)}
.ai-send-btn{background:var(--accent);color:var(--white);font-family:var(--sans);font-size:14px;font-weight:500;padding:10px 20px;border-radius:7px;cursor:pointer;transition:opacity .2s;border:none}
.ai-send-btn:hover{opacity:.88}
.ai-send-btn:disabled{opacity:.5;cursor:not-allowed}
.ai-response{margin-top:14px;padding:14px;background:#f2f1ee;border-radius:8px;font-size:14px;color:var(--gray-700);line-height:1.7;display:none}
.ai-response.show{display:block;animation:stepin .3s ease both}
.ai-wa-link{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;color:var(--green);border:1px solid rgba(37,211,102,.4);border-radius:6px;padding:7px 12px}
.ai-wa-link:hover{background:rgba(37,211,102,.07)}

/* PASSAPORTO INTRO */
.passport-intro{background:var(--gray-100);padding:64px 0 56px}
.section-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-500);margin-bottom:14px}
.section-title{font-family:var(--serif);font-size:clamp(26px,4vw,34px);line-height:1.25;color:var(--black);margin-bottom:18px}
.section-body{font-size:15px;color:var(--gray-700);line-height:1.75;max-width:600px}
.section-body+.section-body{margin-top:14px}
.passport-features{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
@media(max-width:480px){.passport-features{grid-template-columns:1fr}}
.pf-item{background:var(--white);border-radius:10px;padding:16px;border:1px solid var(--gray-300)}
.pf-num{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--accent);line-height:1;margin-bottom:6px}
.pf-label{font-size:14px;font-weight:500;color:var(--black);margin-bottom:4px}
.pf-desc{font-size:13px;color:var(--gray-500)}

/* DENTAL ARCH */
.arch-section{background:#0a0a0a;padding:64px 0 56px}
.arch-title{font-family:var(--serif);font-size:clamp(22px,3.5vw,30px);color:var(--white);margin-bottom:8px}
.arch-sub{font-size:14px;color:#aaa;margin-bottom:36px}
.arch-wrapper{background:#111;border:1px solid #252525;border-radius:14px;padding:28px 20px 20px}
.arch-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#888;margin-bottom:10px;text-align:center}
.arch-row{display:flex;justify-content:center;gap:3px;margin-bottom:4px;flex-wrap:nowrap}
.arch-div{text-align:center;font-size:10px;color:#777;margin:6px 0;letter-spacing:.08em;text-transform:uppercase}
.tooth{width:28px;height:32px;border-radius:6px 6px 4px 4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;transition:transform .15s;cursor:default}
.tooth:hover{transform:scale(1.15)}
.t-green{background:rgba(45,255,122,.12);border:1px solid rgba(45,255,122,.3);color:var(--risk-green)}
.t-yellow{background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.25);color:var(--risk-yellow)}
.t-red{background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.25);color:var(--risk-red)}
.arch-legend{display:flex;gap:16px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.arch-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#aaa}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.leg-green{background:var(--risk-green)}
.leg-yellow{background:var(--risk-yellow)}
.leg-red{background:var(--risk-red)}
.arch-note{font-size:12px;color:#888;text-align:center;margin-top:16px;font-style:italic}
.arch-score{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.arch-score-item{display:flex;align-items:center;gap:6px;background:#1a1a1a;border-radius:20px;padding:5px 12px;font-size:12px}
.sc-num{font-size:16px;font-weight:700}
.sc-green{color:var(--risk-green)}
.sc-yellow{color:var(--risk-yellow)}
.sc-red{color:var(--risk-red)}
.sc-label{color:#888}

/* FILOSOFIA */
.filosofia{background:var(--black);padding:64px 0 56px;border-top:1px solid #1a1a1a}
.color-cards{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.color-card{display:flex;align-items:flex-start;gap:16px;border-radius:12px;padding:20px}
.color-card.cc-green{background:rgba(45,255,122,.05);border:1px solid rgba(45,255,122,.15)}
.color-card.cc-yellow{background:rgba(255,209,102,.05);border:1px solid rgba(255,209,102,.15)}
.color-card.cc-red{background:rgba(255,77,109,.05);border:1px solid rgba(255,77,109,.15)}
.color-card-dot{width:18px;height:18px;border-radius:50%;flex-shrink:0;margin-top:3px}
.cc-green .color-card-dot{background:var(--risk-green);box-shadow:0 0 8px rgba(45,255,122,.5)}
.cc-yellow .color-card-dot{background:var(--risk-yellow);box-shadow:0 0 8px rgba(255,209,102,.5)}
.cc-red .color-card-dot{background:var(--risk-red);box-shadow:0 0 8px rgba(255,77,109,.5)}
.cc-title{font-family:var(--serif);font-size:18px;margin-bottom:4px}
.cc-green .cc-title{color:var(--risk-green)}
.cc-yellow .cc-title{color:var(--risk-yellow)}
.cc-red .cc-title{color:var(--risk-red)}
.cc-desc{font-size:13px;color:#aaa;line-height:1.6}
.cc-badge{font-size:11px;font-weight:600;letter-spacing:.08em;border-radius:4px;padding:3px 8px;display:inline-block;margin-top:8px}
.cc-green .cc-badge{background:rgba(45,255,122,.15);color:var(--risk-green)}
.cc-yellow .cc-badge{background:rgba(255,209,102,.15);color:var(--risk-yellow)}
.cc-red .cc-badge{background:rgba(255,77,109,.15);color:var(--risk-red)}

/* CHIPS */
.chips-section{background:var(--white);padding:56px 0}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{background:var(--gray-100);border:1px solid var(--gray-300);border-radius:50px;padding:8px 16px;font-size:13px;color:var(--gray-700);white-space:normal;word-break:break-word}

/* ACCORDION */
.accordion-section{background:var(--black);padding:64px 0 56px}
.acc-list{border-top:1px solid #252525;margin-top:28px}
.acc-item{border-bottom:1px solid #252525}
.acc-header{display:flex;align-items:center;gap:14px;padding:18px 0;cursor:pointer;user-select:none}
.acc-num{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--accent);flex-shrink:0;width:28px}
.acc-name{font-size:15px;color:var(--white);flex:1;line-height:1.4}
.acc-icon{font-size:20px;color:#888;flex-shrink:0;transition:transform .25s,color .2s;line-height:1}
.acc-item.open .acc-icon{transform:rotate(45deg);color:var(--accent)}
.acc-body{display:none;padding:0 0 20px 42px;font-size:14px;color:#c8c6c0;line-height:1.75}
.acc-item.open .acc-body{display:block;animation:stepin .3s ease both}
.acc-body strong{color:var(--white)}

/* AI SECTION */
.ai-section{background:var(--white);padding:64px 0 56px}
.ai-box{background:var(--gray-100);border:1px solid var(--gray-300);border-radius:14px;padding:28px 24px;margin-top:28px}
.ai-box-label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-500);margin-bottom:10px}
.ai-main-textarea{width:100%;min-height:100px;padding:14px;border:1px solid var(--gray-300);border-radius:8px;font-family:var(--sans);font-size:14px;color:var(--black);background:var(--white);resize:vertical;margin-bottom:12px}
.ai-main-textarea:focus{outline:none;border-color:var(--accent)}
.ai-main-send{background:var(--accent);color:var(--white);font-family:var(--sans);font-size:14px;font-weight:500;padding:12px 24px;border-radius:8px;cursor:pointer;transition:opacity .2s;border:none}
.ai-main-send:hover{opacity:.88}
.ai-main-send:disabled{opacity:.5;cursor:not-allowed}
.ai-main-response{margin-top:16px;padding:16px;background:var(--white);border-radius:8px;border:1px solid var(--gray-300);font-size:14px;color:var(--gray-700);line-height:1.75;display:none}
.ai-main-response.show{display:block;animation:stepin .3s ease both}
.ai-main-wa{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:13px;color:var(--green);border:1px solid rgba(37,211,102,.4);border-radius:7px;padding:8px 14px}
.ai-main-wa:hover{background:rgba(37,211,102,.07)}
.ai-privacy{font-size:12px;color:var(--gray-500);margin-top:12px;line-height:1.5}

/* CTA FINALE */
.cta-section{background:var(--black);padding:72px 0 56px}
.cta-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;margin-bottom:14px}
.cta-pull{font-family:var(--serif);font-style:italic;font-size:clamp(18px,3vw,24px);color:var(--accent);line-height:1.4;margin-bottom:16px}
.cta-h2{font-family:var(--serif);font-size:clamp(28px,4.5vw,38px);line-height:1.2;color:var(--white);margin-bottom:16px}
.cta-body{font-size:15px;color:#c8c6c0;line-height:1.75;margin-bottom:32px}
.dual-cta-lg{display:flex;gap:12px;margin-bottom:12px}
.dual-cta-lg>a{flex:1}
.btn-tel-lg{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--accent);color:var(--white);font-size:15px;font-weight:600;padding:18px 20px;border-radius:10px;transition:opacity .2s;text-align:center}
.btn-tel-lg:hover{opacity:.88}
.btn-tel-lg svg,.btn-wa-lg svg{width:18px;height:18px;flex-shrink:0}
.btn-wa-lg{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--green);color:#fff;font-size:15px;font-weight:600;padding:18px 20px;border-radius:10px;transition:opacity .2s;text-align:center}
.btn-wa-lg:hover{opacity:.88}
@media(max-width:520px){.dual-cta-lg{flex-direction:column}}
.cta-note{font-size:13px;color:#999;margin-bottom:16px}
.cta-wa-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:rgba(37,211,102,.8)}
.cta-wa-link:hover{color:var(--green)}
.cta-wa-link svg{width:14px;height:14px}

/* STUDIO CARD */
.studio-card{background:#111;border:1px solid #222;border-radius:12px;padding:24px;margin-top:40px}
.studio-name{font-family:var(--serif);font-size:18px;color:var(--white);margin-bottom:12px}
.studio-meta{font-size:13px;color:#aaa;margin-bottom:4px}
.studio-address{font-size:14px;color:#aaa;margin-bottom:8px}
.studio-phone a{font-size:14px;color:#bbb;display:inline-flex;align-items:center;gap:5px}
.studio-phone svg{width:13px;height:13px}
.studio-phone a:hover{color:var(--white)}
.studio-appt{font-size:12px;color:#888;margin-top:8px}

/* FOOTER */
footer{background:#0a0a0a;border-top:1px solid #161616;padding:28px 0}
.footer-inner{max-width:680px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.footer-logo{font-family:var(--serif);font-style:italic;font-size:15px;color:#888}
.footer-logo .sm{color:rgba(200,0,92,.6)}
.footer-links{display:flex;gap:16px;flex-wrap:wrap}
.footer-links a{font-size:12px;color:#888;transition:color .2s}
.footer-links a:hover{color:#ccc}

/* STICKY BAR */
.sticky-bar{position:fixed;bottom:0;left:0;right:0;z-index:99;height:56px;display:flex;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1)}
.sticky-bar.show{transform:translateY(0)}
@media(min-width:769px){.sticky-bar{display:none}}
.sticky-wa,.sticky-tel{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;color:#fff}
.sticky-wa{background:var(--green)}
.sticky-tel{background:var(--accent)}
.sticky-wa svg,.sticky-tel svg{width:17px;height:17px}
</style>

<body>

<!-- SVG Sprite -->
